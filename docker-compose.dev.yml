# Docker Compose para desenvolvimento local
version: '3.8'

services:


  # PostgreSQL (se quiser local ao invés do Render)
  postgres:
    image: postgres:15
    container_name: fila-postgres
    environment:
      POSTGRES_DB: fila_digital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fila-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fila-api
    ports:
      - '3001:8080'
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fila_digital?schema=public
      JWT_SECRET: local-dev-secret-key
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fila-network

volumes:
  postgres_data:

networks:
  fila-network:
    driver: bridge
# Para usar:
# 1. docker-compose -f docker-compose.dev.yml up -d
